databases:
  # 1. The PostgreSQL Database
  - name: hiremap-db
    plan: free
    databaseName: hiremap
    user: hiremap_user

services:
  # 2. Redis Cache
  - type: redis
    name: hiremap-redis
    plan: free
    ipAllowList: [] # empty means all services in this Render account can connect

  # 3. The Node.js Web App
  - type: web
    name: hiremap-api
    env: node
    plan: free
    buildCommand: "cd backend && npm install --include=dev && npx prisma generate && npm run build && npx prisma db push"
    startCommand: "cd backend && npm run start"
    envVars:
      - key: NODE_VERSION
        value: "20.10.0"
      - key: DATABASE_URL
        fromDatabase:
          name: hiremap-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: hiremap-redis
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: ENABLE_CRON
        value: "true"
      # You MUST manually fill these out in the Render Dashboard after importing:
      - key: JWT_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
